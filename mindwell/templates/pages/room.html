<!-- templates/call/room.html -->
<div class="call-container">
    <div id="video-grid">
        <div class="video-player" id="local-video"></div>
        <div class="video-player" id="remote-video"></div>
    </div>
    
    <div class="call-controls">
        <button id="toggle-video" class="btn-control">
            <i class="fas fa-video"></i>
        </button>
        <button id="toggle-audio" class="btn-control">
            <i class="fas fa-microphone"></i>
        </button>
        <button id="end-call" class="btn-control end">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>
</div>

<script src="https://unpkg.com/@daily-co/daily-js"></script>
<script>
    const callFrame = window.DailyIframe.createFrame({
        iframeStyle: {
            position: 'fixed',
            width: '100%',
            height: '100%'
        }
    });
    
    callFrame.join({ url: '{{ room_url }}' });
</script>
