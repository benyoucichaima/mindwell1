services:
  - type: web
    name: mindwell-algeria
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-render.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && daphne -b 0.0.0.0 -p $PORT mindwell.asgi:application
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: AI_PROVIDER
        value: gemini
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: mindwell-db
          property: connectionString

databases:
  - name: mindwell-db
    databaseName: mindwell
    user: mindwell
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
